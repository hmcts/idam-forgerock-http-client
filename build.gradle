plugins {
    id 'java-library'
    id 'maven-publish'
}

def javaToolchainVersion = 21
def javaReleaseVersion = 21


project.ext {
    swagger_annotations_version = "1.5.22"
    feign_version = "13.15"
    jackson_annotations_version = "2.20"
    junit_version = "4.12"
}

def buildNumber = System.getenv("RELEASE_VERSION")?.replace("refs/tags/", "") ?: "DEV-SNAPSHOT"

version = buildNumber
group = 'com.github.hmcts'

description = """idam-forgerock-http-client"""


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaToolchainVersion)
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaReleaseVersion
}

repositories {
    mavenCentral()
    maven { url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1') }
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-annotations:$jackson_annotations_version"
    api "io.swagger:swagger-annotations:$swagger_annotations_version"
    api "io.github.openfeign:feign-core:$feign_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

def publishedDependencyBaseline = [
        'com.fasterxml.jackson.core:jackson-annotations',
        'io.github.openfeign:feign-core',
        'io.swagger:swagger-annotations'
] as Set

tasks.register('verifyDependencyBaseline') {
    group = 'verification'
    description = 'Guards the current declared and published dependencies while cleanup removes them deliberately.'
    dependsOn 'generatePomFileForMainPublication'
    doLast {
        def declared = (configurations.api.dependencies + configurations.implementation.dependencies)
                .collect { "${it.group}:${it.name}" }
                .toSet()
        if (declared != publishedDependencyBaseline) {
            throw new GradleException("Direct dependencies changed. Expected ${publishedDependencyBaseline.sort()}, got ${declared.sort()}")
        }

        def pom = new groovy.xml.XmlSlurper().parse(file("$buildDir/publications/Main/pom-default.xml"))
        def published = pom.dependencies.dependency
                .collect { "${it.groupId}:${it.artifactId}" }
                .toSet()
        if (published != publishedDependencyBaseline) {
            throw new GradleException("Published dependencies changed. Expected ${publishedDependencyBaseline.sort()}, got ${published.sort()}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDependencyBaseline')
}

publishing {
    publications {
        Main(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = rootProject.name
            version = project.version
        }
    }
    repositories {
        maven {
            name = "AzureArtifacts"
            url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
            credentials {
                username = System.getenv("AZURE_DEVOPS_ARTIFACT_USERNAME")
                password = System.getenv("AZURE_DEVOPS_ARTIFACT_TOKEN")
            }
        }
    }
}
